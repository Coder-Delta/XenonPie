version: "3.9"

services:

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: xenonpie_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: xenonpie_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: xenonpie
      POSTGRES_PASSWORD: xenonpie123
      POSTGRES_DB: xenonpie
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xenonpie"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── XenonPie Bot ─────────────────────────────────────────────────────────────
  xenonpie:
    build: .
    container_name: xenonpie_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+asyncpg://xenonpie:xenonpie123@postgres:5432/xenonpie
    volumes:
      - ./logs:/app/logs
      - ./.cache:/app/.cache
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: python main.py

volumes:
  redis_data:
  postgres_data: